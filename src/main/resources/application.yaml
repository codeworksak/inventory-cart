app:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  rabbitmq:
    queue-name: ${RABBIT_Q:"order-q"}
    exchange-name: ${RABBIT_EXCHANGE:"ordering"}
    routing-key: ${RABBIT_ROUTE_KEY:"order-routing"}
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframewor.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  application:
    name: inventory-cart
